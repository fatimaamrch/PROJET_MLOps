name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Tests (pipeline, MLflow tracking/registry, API)
        run: make test

      - name: Smoke-run the full pipeline on the real dataset
        run: make pipeline

      - name: Build the serving image
        run: make docker-build
